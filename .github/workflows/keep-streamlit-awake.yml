# .github/workflows/keep-streamlit-awake.yml
#
# Keeps a Streamlit Community Cloud app from going to sleep by loading it in a
# real (headless) browser on a schedule. A plain `curl` often is NOT enough,
# because Streamlit measures "activity" via the browser's websocket connection,
# not raw HTTP hits. Playwright opens the page like a real visitor, which both
# resets the inactivity timer AND clicks the "get this app back up" button if
# the app happens to already be asleep.

name: Keep Streamlit app awake

on:
  schedule:
    # Every 6 hours. Streamlit only sleeps after ~12h of no traffic, so this
    # gives two pings per sleep window with margin to spare. This cadence is
    # also cheap: ~4 runs/day keeps you well under GitHub Free's 2,000
    # Actions-minutes/month cap for PRIVATE repos. (Public repos = unlimited,
    # so you could safely go more frequent there.) GitHub may delay scheduled
    # runs under load, so don't rely on exact timing. Cron here is in UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Avoid piling up runs if one is slow.
concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Needed so the heartbeat step can push a commit back to the repo.
    permissions:
      contents: write
    env:
      APP_URL: "https://huali-research-rag.streamlit.app/"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app (and wake it if asleep)
        run: |
          python - <<'PY'
          import os, sys
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              print(f"Opening {url}")
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)

              # If the app is asleep, Streamlit shows a button to bring it back.
              # The label has varied over time, so match a few possibilities.
              wake_selectors = [
                  "button:has-text('Yes, get this app back up')",
                  "button:has-text('get this app back up')",
                  "button:has-text('back up')",
              ]
              for sel in wake_selectors:
                  try:
                      btn = page.locator(sel)
                      if btn.count() > 0 and btn.first.is_visible():
                          print(f"App was asleep — clicking wake button ({sel})")
                          btn.first.click()
                          break
                  except Exception as e:
                      print(f"(wake check skipped for {sel}: {e})")

              # Give the websocket time to connect / the app to spin up.
              page.wait_for_timeout(20_000)
              print("Page title:", page.title())
              browser.close()
              print("Done — app pinged successfully.")
          PY

      - name: Heartbeat commit on dedicated branch (prevents 60-day auto-disable)
        # GitHub disables scheduled workflows after 60 days with no repo
        # activity. A push to ANY branch counts as activity, so we keep all
        # heartbeats on an isolated "keepalive" branch — your default branch and
        # its history stay completely untouched. To avoid noise, we only push
        # when the most recent activity (on either the default branch or the
        # keepalive branch) is older than 50 days.
        env:
          BRANCH: keepalive
        run: |
          set -e
          NOW_TS=$(date +%s)

          # Latest commit on the current (default) branch counts as activity.
          LAST_TS=$(git log -1 --format=%ct)

          # If the keepalive branch already exists, factor in its latest commit.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH" --depth=1
            KEEP_TS=$(git log -1 --format=%ct FETCH_HEAD)
            if [ "$KEEP_TS" -gt "$LAST_TS" ]; then LAST_TS="$KEEP_TS"; fi
          fi

          DAYS_SINCE=$(( (NOW_TS - LAST_TS) / 86400 ))
          echo "Days since last repo activity: $DAYS_SINCE"
          if [ "$DAYS_SINCE" -lt 50 ]; then
            echo "Repo is active enough — no heartbeat needed."
            exit 0
          fi

          echo "Approaching dormancy — writing heartbeat to '$BRANCH' branch."
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # Append to the existing isolated branch.
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            # First time: create an orphan branch containing only .keepalive.
            git checkout --orphan "$BRANCH"
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keep-alive heartbeat [skip ci]"
          git push origin "$BRANCH"
          echo "Heartbeat committed to '$BRANCH'."
